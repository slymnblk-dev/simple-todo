<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)" />
  <title>Simple Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="date" id="date"></p>
        <h1>Today</h1>
      </div>
      <div class="tools">
      <button class="theme" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="theme" id="theme" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      </div>
    </header>

    <p class="count" id="count"></p>

    <ul class="list" id="list"></ul>

    <div class="empty" id="empty">
      <div class="empty-dot"></div>
      <p>Nothing to do. Enjoy the calm.</p>
    </div>

    <form class="add" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Add a task…" maxlength="200" enterkeyhint="done" />
      <button type="submit" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
  </main>

  <div class="modal" id="modal">
    <div class="sheet">
      <h2>Delete task?</h2>
      <p id="modal-text"></p>
      <div class="row">
        <button class="btn-cancel" id="cancel">Cancel</button>
        <button class="btn-delete" id="confirm">Delete</button>
      </div>
    </div>
  </div>
  <div class="settings" id="settings">
    <div class="settings-inner">
      <header class="top">
        <h1>Settings</h1>
        <button class="theme" id="settings-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <h3>Accent color</h3>
      <div class="swatches" id="swatches"></div>
      <h3>Text size</h3>
      <div class="seg" id="sizes">
        <button data-size="0.9">Small</button>
        <button data-size="1">Medium</button>
        <button data-size="1.15">Large</button>
      </div>
      <p class="version" id="version"></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
